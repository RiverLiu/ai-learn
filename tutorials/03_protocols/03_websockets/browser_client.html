<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSocket Demo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 760px;
      margin: 32px auto;
      padding: 0 16px;
      line-height: 1.6;
    }
    label, input, button {
      font: inherit;
    }
    input {
      padding: 8px;
      width: min(100%, 420px);
    }
    button {
      padding: 8px 12px;
      margin-left: 4px;
    }
    pre {
      min-height: 220px;
      padding: 12px;
      background: #111827;
      color: #e5e7eb;
      overflow: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>WebSocket 浏览器客户端</h1>
  <p>打开两个浏览器标签页，可以观察广播效果。</p>

  <p>
    <label>
      Client ID:
      <input id="clientId" value="browser-user">
    </label>
    <button id="connect">连接</button>
    <button id="disconnect">断开</button>
  </p>

  <p>
    <input id="message" value="你好，WebSocket">
    <button id="send">发送</button>
  </p>

  <pre id="log"></pre>

  <script>
    const log = document.querySelector("#log");
    const clientIdInput = document.querySelector("#clientId");
    const messageInput = document.querySelector("#message");
    let socket;

    function append(line) {
      log.textContent += line + "\n";
      log.scrollTop = log.scrollHeight;
    }

    document.querySelector("#connect").addEventListener("click", () => {
      if (socket && socket.readyState === WebSocket.OPEN) {
        append("already connected");
        return;
      }
      const clientId = encodeURIComponent(clientIdInput.value || "browser-user");
      socket = new WebSocket(`ws://${location.host}/ws/chat/demo-room?client_id=${clientId}`);
      socket.addEventListener("open", () => append("connected"));
      socket.addEventListener("message", (event) => append("message: " + event.data));
      socket.addEventListener("close", (event) => append(`closed: code=${event.code}`));
      socket.addEventListener("error", () => append("error"));
    });

    document.querySelector("#send").addEventListener("click", () => {
      if (!socket || socket.readyState !== WebSocket.OPEN) {
        append("not connected");
        return;
      }
      socket.send(messageInput.value);
    });

    document.querySelector("#disconnect").addEventListener("click", () => {
      if (socket) {
        socket.close(1000, "user closed");
      }
    });
  </script>
</body>
</html>
